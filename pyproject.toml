[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"

[tool.poetry]
name = "labyrinth_game"
version = "1.0.0"
description = "Текстовая игра-лабиринт"
authors = ["Имя Фамилия <email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.0"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = []

[tool.ruff.format]
quote-style = "double"